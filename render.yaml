services:
  - type: web
    name: ceylone-nature-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: CeyloneNatureApi
      - key: Jwt__Audience
        value: CeyloneNatureClient
      - key: PayPal__Mode
        value: sandbox
      - key: PayPal__ClientId
        sync: false
      - key: PayPal__ClientSecret
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false

# No `databases:` block here on purpose: Render's Blueprint flow provisions
# its bundled free Postgres through the same account-verification path that
# requires a card on file. Use an external free Postgres instead (Neon or
# Supabase both offer a genuinely card-free free tier) and paste its
# connection string into ConnectionStrings__DefaultConnection above — the
# API accepts the postgres:// URI format either provider hands out.
# If you'd rather use Render's own managed Postgres and are fine adding a
# card, uncomment this block and redeploy via Blueprint:
# databases:
#   - name: ceylone-nature-db
#     plan: free
#     databaseName: ceylon_nature
#     user: ceylon_nature
